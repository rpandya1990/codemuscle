services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codemuscle
      POSTGRES_USER: codemuscle
      POSTGRES_PASSWORD: codemuscle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemuscle -d codemuscle"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://codemuscle:codemuscle@postgres:5432/codemuscle
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WEB_ORIGIN: http://localhost:3000
      AI_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:

